# 模型配置
models:
  # meta-llama/llama-3-8b-instruct, meta-llama/llama-3.2-3b-instruct:free
  # "saves/Qwen3-1.7B-Instruct/full/sft", meta-llama/llama-3.3-8b-instruct:free
  # "gpt-4o"， "claude-3-7-sonnet-latest", "qwen2.5-3b-instruct", "gemini-2.5-flash-thinking", "gemini-2.5-pro"
  # "deepseek-chat", "deepseek-reasoner", "claude-3-5-sonnet-latest", "saves/Qwen3-4B-Thinking/full/ep3", "saves/Qwen3-4B-Thinking/full/ep5"
  # "gpt-5", "qwen2.5-3b-instruct", "saves/Qwen3-1.7B-Thinking/full/train_2025-09-25-23-33-09", 
  # "meta-llama/llama-3.2-3b-instruct", "meta-llama/llama-3.2-1b-instruct", "meta-llama/llama-3.2-3b-instruct:free"
  # "saves/Llama-3.2-1B-Instruct/full/llama_1b_ep1_5e5", "qwen3-1.7b"
  small_model: "gpt-4.1-mini" 
  large_model: "gpt-4.1-mini"   # 大模型
  router_model: "gpt-4o"  # 路由模型
  enable_threshold: False
  threshold: 5  # 难度阈值，大于等于此值时使用大模型
  use_local_router: True  # 是否使用本地部署的路由模型
  local_router_model: "saves/Llama-3.2-1B-Instruct/full/Llama-3-2-1B_ep5"  # 本地模型路径

# API配置
api:
  # usage/bianxie, usage/deepseek2, usage/local, usage/openrouter, usage/bianxie1, usage/qwen
  small_key_path: "usage/bianxie1"
  large_key_path: "usage/bianxie1"
  router_key_path: "usage/local"

  # "https://api.bianxie.ai/v1", "https://openrouter.ai/api/v1", "https://api.deepseek.com"
  # "http://127.0.0.1:6006/v1", "http://127.0.0.1:8000/v1", https://dashscope.aliyuncs.com/compatible-mode/v1
  small_api_base_url: "https://api.bianxie.ai/v1"  # 小模型API基础URL
  large_api_base_url: "https://api.bianxie.ai/v1"  # 大模型API基础URL
  router_api_base_url: "https://api.bianxie.ai/v1"  # 路由模型API基础URL
  local_router_base_url: "http://127.0.0.1:8000/v1"  # 本地部署的路由模型API基础URL

# 请求超时设置
timeout: 1000  # 默认API请求超时时间(秒)

# 系统配置
system:
  prompt_path: "prompt/generate_prompt.txt"
  compare_prompt_path: "prompt/direct_solve_prompt.txt"
  workers: 10  # 并行工作线程数
  enable_judge: True  # 是否启用答案正确性判断
  gold_answer: "16"  # 标准答案，如果启用判断则必填
# 查询配置
# query: "What is the result of 1+1?"
# query: "3. (6 points) A construction company was building a tunnel. When $\\frac{1}{3}$\\ of the tunnel was completed at the original speed, they started using new equipment, which increased the construction speed by $20 \\%$ and reduced the working hours to $80 \\%$ of the original. As a result, it took a total of 185 days to complete the tunnel. If they had not used the new equipment and continued at the original speed, it would have taken $\\qquad$ days to complete the tunnel."
query: "Define all possible orientations and placements of the L-shaped tile within the 2x5 rectangle." # 一个会输出很好并行度的例子 Ans: 16

# 数据集配置
dataset:
  enabled: True  # 是否启用数据集模式（评估或构建）
  path: "dataset/TestData/AIME24_25.json"
  limit: 60
  output_dir: "model_compare_results/"
  
  # 新增：数据集构建配置
  build:
    enabled: False  # 设置为 true 以构建数据集，而不是评估
    use_models_for_execution: False  # 如果为 false，只生成计划而不执行子任务
    use_ground_truth_to_guide_planner: False  # 使用 'solution' 字段来指导 planner
    save_thinking: False  # 是否保存 planner 输出中的 <think> 块

# 新增：评估配置
evaluation:
  enabled: False  # Master switch for all evaluations
  planner_enabled: False  # Switch for planner evaluation
  executor_enabled: False  # Switch for executor evaluation
  model: "deepseek-chat"  # Model to use for judging
  key_path: "usage/deepseek2" # API key for the evaluation model
  api_base_url: "https://api.deepseek.com" # API base URL for the evaluation model