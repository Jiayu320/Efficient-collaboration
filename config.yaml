# 模型配置
models:
  # small_model: "meta-llama/llama-3.1-8b-instruct" # meta-llama/llama-3.1-8b-instruct, qwen/qwen-2.5-7b-instruct, deepseek/deepseek-r1-0528-qwen3-8b
  # large_model: "openai/gpt-4o" # meta-llama/llama-3.3-70b-instruct, deepseek/deepseek-r1-0528, anthropic/claude-3.5-sonnet, google/gemini-2.5-flash
  # router_model: "anthropic/claude-3.5-sonnet" # anthropic/claude-sonnet-4, openai/gpt-4o, qwen/qwen3-235b-a22b
  small_model: "qwen/qwen-2.5-7b-instruct"
  large_model: "gpt-4"  # 大模型
  router_model: "claude-3-5-sonnet-latest"  # 路由模型
  threshold: 3
  local_threshold: 3  # 难度阈值，大于等于此值时使用大模型
  use_local_router: False  # 是否使用本地部署的路由模型
  local_router_model: "saves/Qwen3-1.7B-Instruct/full/sft"  # 本地模型路径

# API配置
api:
  small_key_path: "usage/openrouter1"
  large_key_path: "usage/bianxie" # usage/bianxie
  router_key_path: "usage/bianxie"
  base_url: "https://api.bianxie.ai/v1"
  small_api_base_url: "https://openrouter.ai/api/v1"  # 小模型API基础URL
  large_base_url: "https://api.bianxie.ai/v1"  # 大模型API基础URL
  router_base_url: "https://api.bianxie.ai/v1"  # 路由模型API基础URL
  # base_url: "https://openrouter.ai/api/v1" # https://api.bianxie.ai/v1
  # small_api_base_url: "https://openrouter.ai/api/v1"  # 小模型API基础URL
  # large_api_base_url: "https://openrouter.ai/api/v1"  # 大模型API基础URL
  # router_api_base_url: "https://openrouter.ai/api/v1"  # 路由模型API基础URL
  local_router_base_url: "http://127.0.0.1:8000/v1"  # 本地部署的路由模型API基础URL

# 系统配置
system:
  prompt_path: "prompt/generate_prompt.txt"
  compare_prompt_path: "prompt/direct_solve_prompt.txt"
  workers: 10  # 并行工作线程数
  enable_judge: True  # 是否启用答案正确性判断
  gold_answer: "First, we simplify the expression: $$\\sqrt{6-x-x^2}=\\sqrt{(2-x)(3+x)}$$ The expression inside the square root must be non-negative. The quadratic changes signs at the roots $2$ and $-3$ and is positive between the two values. Therefore, the domain of the expression is $\\boxed{[-3,2]}$."  # 标准答案，如果启用判断则必填
# 查询配置
# query: "Find the last three digits of the product of the positive roots of $\\sqrt{1995}x^{\\log_{1995}x}=x^2.$"
# query: "What is the result of 1+1?"
# query: "3. (6 points) A construction company was building a tunnel. When $\\frac{1}{3}$\\ of the tunnel was completed at the original speed, they started using new equipment, which increased the construction speed by $20 \\%$ and reduced the working hours to $80 \\%$ of the original. As a result, it took a total of 185 days to complete the tunnel. If they had not used the new equipment and continued at the original speed, it would have taken $\\qquad$ days to complete the tunnel."
query: "Define all possible orientations and placements of the L-shaped tile within the 2x5 rectangle."
dataset:
  enabled: False  # 是否启用数据集
  path: "dataset/original_data/math200.json"
  limit: 2
  output_dir: "model_compare_results/"
