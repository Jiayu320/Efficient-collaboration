# 模型配置
models:
  # meta-llama/llama-3-8b-instruct, meta-llama/llama-3.2-3b-instruct:free
  # "saves/Qwen3-1.7B-Instruct/full/sft", "Qwen/Qwen2.5-3B-Instruct" , meta-llama/llama-3.3-8b-instruct:free
  # "gpt-4o"， "claude-3-7-sonnet-latest", "qwen2.5-3b-instruct", "gemini-2.5-flash-thinking", "gemini-2.5-pro"
  small_model: "gpt-4o" 
  large_model: "gpt-4o"   # 大模型
  router_model: "gemini-2.5-flash-thinking"  # 路由模型
  enable_threshold: False
  threshold: 1  # 难度阈值，大于等于此值时使用大模型
  use_local_router: False  # 是否使用本地部署的路由模型
  local_router_model: "meta-llama/llama-3.2-3b-instruct:free"  # 本地模型路径

# API配置
api:
  # usage/bianxie, usage/deepseek2, usage/local, usage/openrouter, usage/bianxie1, usage/qwen
  small_key_path: "usage/bianxie1"
  large_key_path: "usage/bianxie1"
  router_key_path: "usage/bianxie1"

  # "https://api.bianxie.ai/v1", "https://openrouter.ai/api/v1", "https://api.deepseek.com"
  # "http://127.0.0.1:6006/v1", "http://127.0.0.1:8000/v1", https://dashscope.aliyuncs.com/compatible-mode/v1
  small_api_base_url: "https://api.bianxie.ai/v1"  # 小模型API基础URL
  large_api_base_url: "https://api.bianxie.ai/v1"  # 大模型API基础URL
  router_api_base_url: "https://api.bianxie.ai/v1"  # 路由模型API基础URL
  local_router_base_url: "https://openrouter.ai/api/v1"  # 本地部署的路由模型API基础URL

# 请求超时设置
timeout: 300  # 默认API请求超时时间(秒)

# 系统配置
system:
  prompt_path: "prompt/generate_prompt.txt"
  compare_prompt_path: "prompt/direct_solve_prompt.txt"
  workers: 10  # 并行工作线程数
  enable_judge: True  # 是否启用答案正确性判断
  gold_answer: "16"  # 标准答案，如果启用判断则必填
# 查询配置
# query: "What is the result of 1+1?"
# query: "3. (6 points) A construction company was building a tunnel. When $\\frac{1}{3}$\\ of the tunnel was completed at the original speed, they started using new equipment, which increased the construction speed by $20 \\%$ and reduced the working hours to $80 \\%$ of the original. As a result, it took a total of 185 days to complete the tunnel. If they had not used the new equipment and continued at the original speed, it would have taken $\\qquad$ days to complete the tunnel."
query: "Define all possible orientations and placements of the L-shaped tile within the 2x5 rectangle." # 一个会输出很好并行度的例子 Ans: 16
dataset:
  enabled: True  # 是否启用数据集
  path: "dataset/TestData/s1k1_1.json"
  limit: 1
  output_dir: "model_compare_results/"
