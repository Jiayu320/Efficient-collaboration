# ---------------------------------
# DPO 偏好数据集构建配置
# ---------------------------------

# 源数据集和输出设置
dataset:
  input_path: "dataset/used_dataset/limo.json"  # 输入问题数据集的路径
  output_path: "dpo_preference_dataset.json" # 输出偏好数据集的路径
  limit: 5 # 为测试目的，处理多少个问题。设置为 null 或删除此行以处理整个数据集。

# Planner (规划者) 模型配置 - 用于生成候选计划
planner:
  model: "saves/Qwen3-4B-Thinking/full/ep5" # 用于生成计划的模型名称
  base_url: "http://127.0.0.1:8000/v1" # Planner模型的API基础URL
  key_path: "keys/local_key.txt" # 本地或自定义Planner模型的API密钥路径 (如果需要)
  enable_thinking: true # 是否在Prompt中强制Planner进行<think>思考
  sampling_count: 5 # 为每个问题生成多少个候选计划 (建议至少为2)

# Evaluator (评估者) 模型配置 - 用于给计划打分
evaluator:
  model: "gpt-4o" # 用于评估计划质量的模型
  base_url: "https://api.openai.com/v1" # 评估模型的API基础URL
  key_path: "keys/openai_key.txt" # 评估模型API密钥的文件路径

# 日志文件配置
logging:
  log_file: "dpo/dpo_dataset_builder.log"
